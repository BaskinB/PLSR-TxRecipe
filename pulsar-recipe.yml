# Credits to qbox-project for the base/layout of this recipe.

$engine: 3
$onesync: on
name: Pulsar Framework
version: 1.0.0
author: Pulsar Framework
description: One-click txAdmin recipe to deploy Pulsar Framework.

tasks:
  #  Download Base Files
  - action: download_github
    src: https://github.com/BaskinB/PLSR-TxRecipe
    ref: main
    dest: ./tmp/pulsar

  - action: move_path
    src: ./tmp/pulsar/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/pulsar/configs/core.cfg
    dest: ./configs/core.cfg

  - action: move_path
    src: ./tmp/pulsar/configs/ox.cfg
    dest: ./configs/ox.cfg

  - action: move_path
    src: ./tmp/pulsar/configs/permissions.cfg
    dest: ./configs/permissions.cfg

  - action: move_path
    src: ./tmp/pulsar/configs/resources.cfg
    dest: ./configs/resources.cfg

  - action: move_path
    src: ./tmp/pulsar/logo96.png
    dest: ./logo96.png

  # Prepare Database
  - action: connect_database
  - action: query_database
    file: ./tmp/pulsar/pulsar.sql

  - action: waste_time
    seconds: 10

  # STANDALONE
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  - action: download_file
    path: ./tmp/coords.zip
    url: https://github.com/PulsarFW/coords/releases/latest/download/coords.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/coords.zip

  - action: download_file
